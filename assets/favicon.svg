<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
	<rect width="16" height="16" rx="3" fill="#0a0a0f"/>
	<path d="M4 3.5 L9 8 L4 12.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
	<!-- El parpadeo solo se anima en navegadores con favicon SVG animado (Chromium);
	     en Firefox/Safari se ve fijo. Mismo ritmo que el cursor del sitio: 1.1s -->
	<rect x="9.5" y="11.8" width="5" height="2" rx="1" fill="#ff3366">
		<animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.5" dur="1.1s" repeatCount="indefinite"/>
	</rect>
</svg>
